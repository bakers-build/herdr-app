# Lint, format check, type check, hygiene and Herdr-types checks, and test with a coverage
# floor, on every push and PR.
# Follows Herdr's ci.yml (herdrdev/herdr-app v0.1.15): pinned Bun, actions pinned
# to commits, read-only token, and caches that only pushes to main save, so PR
# caches can't evict the one everybody restores. See docs/conventions.md.
name: ci

on:
  # Every branch, unlike Herdr (master only): each push gets checked.
  push:
  # edited: a title change reruns the pr-title check.
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# A newer push cancels older runs of the same PR or ref, except on main and next, whose
# runs release: a cancelled release could leave a tag without its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

env:
  BUN_VERSION: 1.4.4
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  # Herdr's stable check name.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The workflows themselves (with shellcheck on run: scripts); Docker is preinstalled.
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      # No cache, runtime or Herdr-written file is committed (scripts/check/hygiene.ts).
      - name: Hygiene
        run: bun run hygiene
      # The vendored Herdr types match types/herdr-version.json.
      - name: Herdr types
        run: bun run herdr-types
      # bun test --coverage, then the repo-wide floor (scripts/check/coverage.ts).
      - name: Test
        run: bun run test
      - name: Save dependency cache
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The mod's JSON:API reads against the real bakers server (release image, SQLite, the
  # server's own e2e seed): tests/contract/run.ts. The image is public; no secret is used.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Contract test
        run: bun run test:contract

  # Loads the mod in the pinned Herdr (herdr-app check): the Linux build from Herdr's
  # releases, checksum from types/herdr-version.json, under a virtual display with
  # software Vulkan (Mesa), as Herdr's own Linux CI renders headless.
  herdr-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Herdr runtime libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libwayland-client0 \
            libvulkan1 mesa-vulkan-drivers libfontconfig1 libfreetype6 xvfb xauth
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Herdr check
        run: xvfb-run -a bun run herdr-check

  # The mod in the real, running Herdr window against the seeded bakers server, nothing
  # stubbed: tests/e2e/run.ts. The real bakers CLI (the server's version) signs in with the
  # seed's API key (client credentials); every home is a temp directory. No secret is used.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Herdr runtime libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libxcb1 libwayland-client0 \
            libvulkan1 mesa-vulkan-drivers libfontconfig1 libfreetype6 xvfb xauth
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install
        run: bun install --frozen-lockfile
      - name: bakers CLI
        run: npm install -g @bakers-build/bakers@0.11.0
      - name: E2E test
        run: xvfb-run -a bun run test:e2e

  # The squash into next makes the PR title the commit that decides the version bump.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # The title only ever reaches the script through env, never inside run.
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/release/pr-title.ts

  # Tags and publishes a GitHub release: stable vX.Y.Z on main (the merged next SHA),
  # vX.Y.Z-next.N pre-releases on next. Nothing to release (or already released) is a no-op.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${BUN_VERSION}"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Target
        id: target
        run: bun scripts/release/target.ts "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Version
        id: version
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PRE: ${{ steps.target.outputs.pre }}
        run: |
          VERSION="$(bun scripts/release/version.ts "$SHA" ${PRE:+--pre "$PRE"} --notes notes.md)"
          if [ -z "$VERSION" ]; then echo "nothing to release at $SHA"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Package and publish
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          PRE: ${{ steps.target.outputs.pre }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun scripts/release/package.ts "$VERSION"
          gh release create "v$VERSION" "dist/herdr-bakers-$VERSION.zip" --target "$SHA" --title "v$VERSION" --notes-file notes.md ${PRE:+--prerelease}
          echo "released v$VERSION: $(gh release view "v$VERSION" --json url -q .url)"
          echo "asset: herdr-bakers-$VERSION.zip"
